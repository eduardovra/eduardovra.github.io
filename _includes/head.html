<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  {% feed_meta %}

  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">

  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme) { document.documentElement.setAttribute('data-theme', theme); }
    })();
  </script>

  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/space-grotesk-latin.woff2' | relative_url }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/libre-franklin-latin.woff2' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% if site.analytics and jekyll.environment == 'production' %}
    {% include analytics.html %}
  {% endif %}
</head>
