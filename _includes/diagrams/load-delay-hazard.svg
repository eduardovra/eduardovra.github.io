<svg viewBox="0 0 432 186" role="img" aria-labelledby="load-title" style="width:100%;max-width:620px;height:auto;display:block;margin:1.5rem auto;font-family:var(--mono)">
  <title id="load-title">A load delivers its value in cycle 4, but the instruction behind it reads its registers in cycle 3, one cycle earlier</title>
  <text x="8" y="32" fill="var(--faint)" font-size="11.5" font-family="var(--text)">cycle</text>
  <text x="189" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">1</text>
  <text x="231" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">2</text>
  <text x="273" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">3</text>
  <text x="315" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">4</text>
  <text x="357" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">5</text>
  <text x="399" y="32" text-anchor="middle" fill="var(--faint)" font-size="12">6</text>
  <text x="8" y="62" fill="var(--ink)" font-size="12">lw    $t0, 0($a0)</text>
  <rect x="170" y="44" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="189" y="62" text-anchor="middle" font-size="12" fill="var(--muted)">IF</text>
  <rect x="212" y="44" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="231" y="62" text-anchor="middle" font-size="12" fill="var(--muted)">RD</text>
  <rect x="254" y="44" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="273" y="62" text-anchor="middle" font-size="12" fill="var(--muted)">ALU</text>
  <rect x="296" y="44" width="38" height="26" rx="3" fill="var(--accent)" stroke="var(--accent)"/>
  <text x="315" y="62" text-anchor="middle" font-size="12" fill="var(--bg)" font-weight="600">MEM</text>
  <rect x="338" y="44" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="357" y="62" text-anchor="middle" font-size="12" fill="var(--muted)">WB</text>
  <text x="8" y="102" fill="var(--ink)" font-size="12">addu  $t1, $t0, $t2</text>
  <rect x="212" y="84" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="231" y="102" text-anchor="middle" font-size="12" fill="var(--muted)">IF</text>
  <rect x="254" y="84" width="38" height="26" rx="3" fill="var(--accent)" stroke="var(--accent)"/>
  <text x="273" y="102" text-anchor="middle" font-size="12" fill="var(--bg)" font-weight="600">RD</text>
  <rect x="296" y="84" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="315" y="102" text-anchor="middle" font-size="12" fill="var(--muted)">ALU</text>
  <rect x="338" y="84" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="357" y="102" text-anchor="middle" font-size="12" fill="var(--muted)">MEM</text>
  <rect x="380" y="84" width="38" height="26" rx="3" fill="var(--code-bg)" stroke="var(--line)"/>
  <text x="399" y="102" text-anchor="middle" font-size="12" fill="var(--muted)">WB</text>
  <line x1="329" y1="18" x2="329" y2="44" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="315" y="13" text-anchor="middle" fill="var(--accent)" font-size="11.5" font-family="var(--text)">$t0 arrives from memory here</text>
  <line x1="273" y1="110" x2="273" y2="126" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="273" y="140" text-anchor="middle" fill="var(--accent)" font-size="11.5" font-family="var(--text)">but $t0 is read here, a cycle earlier</text>
  <text x="8" y="174" fill="var(--muted)" font-size="12.5" font-family="var(--text)">The value is needed one cycle before it exists.</text>
</svg>
